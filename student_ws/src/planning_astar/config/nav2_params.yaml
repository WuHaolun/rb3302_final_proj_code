amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    update_min_a: 0.05
    update_min_d: 0.01
    
    sigma_hit: 0.1
    alpha1: 0.4
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.4
    alpha5: 0.2

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # 0.5 m in 10 s (the default) is too demanding when the rover is
      # threading a 0.6 m gap and spends time rotating in place.
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # The rubric wants the chassis fully covering a 0.10 m centre label.
      # Half-width is 0.144 m, so 0.08 m of slop still covers it. The default
      # 0.25 m does not.
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.79
      stateful: true

    # --- DWB Local Planner (replaces Regulated Pure Pursuit) ---
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      publish_local_plan: true
      publish_transformed_plan: true
      publish_trajectories: false

      # Velocity limits — matched to the velocity_smoother below
      # (0.08 m/s linear, 0.4 rad/s angular) so DWB doesn't plan
      # trajectories the smoother will clip.
      min_vel_x: -0.05 #0.0
      max_vel_x: 0.15
      max_vel_y: 0.0           # Differential drive — no strafe
      min_vel_y: 0.0
      max_vel_theta: 1.0 # from 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.15       # Match max_vel_x
      min_speed_theta: 0.0 # from 0.0

      # Acceleration limits — matched to velocity_smoother max_accel/max_decel
      acc_lim_x: 0.05
      acc_lim_y: 0.0
      acc_lim_theta: 2.0 # from 0.5
      decel_lim_x: -0.05
      decel_lim_y: 0.0
      decel_lim_theta: -0.5

      # Trajectory simulation
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 40
      sim_time: 2.0 #1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.03  # Match goal_checker
      # Must be below max_vel_x, otherwise the rover is always treated as "stopped"
      trans_stopped_velocity: 0.02

      # Trajectory scoring critics
      short_circuit_trajectory_filter: true
      stateful: True
      shorten_transformed_plan: true
      forward_prune_distance: 0.5

      critics:
        ["RotateToGoal", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        # removed "Oscillation" from this list 

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 48.0
      GoalDist.scale: 6.0
      RotateToGoal.scale: 32.0 #32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real Wave Rover: 0.18 m long, 0.17 m across the wheels (diffbot.urdf.xacro).
      # The 0.05 m placeholder that was here let Nav2 plan straight through walls.
      footprint: "[[-0.09, -0.085], [0.09, -0.085], [0.09, 0.085], [-0.09, 0.085]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          # Laser points are at z=0.09 m in odom; allow them through the height filter.
          max_obstacle_height: 2.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Default is 0.55 m — wider than a whole 0.6 m cell, which floods the
        # course. Keep it just past the inscribed radius (0.144 m) with a
        # gentle falloff so paths stay centred without sealing the gaps.
        inflation_radius: 0.05
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      rolling_window: false
      robot_base_frame: base_link
      resolution: 0.05
      # Real Wave Rover: 0.18 m long, 0.17 m across the wheels (diffbot.urdf.xacro).
      # The 0.05 m placeholder that was here let Nav2 plan straight through walls.
      footprint: "[[-0.09, -0.085], [0.09, -0.085], [0.09, 0.085], [-0.09, 0.085]]"
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: false
          marking: true
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Default is 0.55 m — wider than a whole 0.6 m cell, which floods the
        # course. Keep it just past the inscribed radius (0.144 m) with a
        # gentle falloff so paths stay centred without sealing the gaps.
        inflation_radius: 0.25
        cost_scaling_factor: 9.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      cost_travel_multiplier: 5.0
      tolerance: 0.1
      allow_unknown: False
      downsample_costmap: false
      max_iterations: 1000000
      max_planning_time: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10


smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.0, 0.8]
    min_velocity: [-0.15, 0.0, -0.8]
    max_accel: [0.05, 0.0, 0.5]
    max_decel: [-0.05, 0.0, -0.5]
    odom_topic: /odom
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      # The rubric requires stopping at least 3 s at each landmark.
      # This is in milliseconds; default is 0.
      enabled: true
      waypoint_pause_duration: 2500
